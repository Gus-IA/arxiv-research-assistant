services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: arxiv-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - arxiv_postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  app:
    build: .
    container_name: arxiv-app
    env_file:
      - .env
    environment:
      # Inside Docker the database is reached by service name and internal port
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  arxiv_postgres_data: